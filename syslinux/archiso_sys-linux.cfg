LABEL arch
TEXT HELP
Boot the Ditana GNU/Linux install medium on BIOS.
It allows you to install Ditana GNU/Linux or perform system maintenance.
ENDTEXT
MENU LABEL Ditana GNU/Linux install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% cow_spacesize=8G archisosearchuuid=%ARCHISO_UUID%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Ditana GNU/Linux install medium on BIOS with speakup screen reader.
It allows you to install Ditana GNU/Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Ditana GNU/Linux install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% cow_spacesize=8G archisosearchuuid=%ARCHISO_UUID% accessibility=on
