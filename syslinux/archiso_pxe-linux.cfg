LABEL arch_nbd
TEXT HELP
Boot the Ditana GNU/Linux install medium using NBD.
It allows you to install Ditana GNU/Linux or perform system maintenance.
ENDTEXT
MENU LABEL Ditana GNU/Linux install medium (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% cow_spacesize=8G archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y
SYSAPPEND 3

